name: Full-stack checks
on: [push, workflow_dispatch]
jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: integration
          POSTGRES_DB: careerpilot
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres:integration@localhost:5432/careerpilot
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm run build
        working-directory: web
      - run: pip install -r requirements.txt httpx
      - run: PYTHONPATH=. python tests/smoke.py
